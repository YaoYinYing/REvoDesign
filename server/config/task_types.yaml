# REvoDesign task type registry — portable definitions (checked into git).
#
# Each entry declares what a task *is*: Docker image, command, I/O contract,
# progress stages, and the parameters users can submit.  Machine-specific
# paths and resource limits live in config/runners/<name>.yaml.
#
# Adding a task type = one entry here + one runner YAML + Dockerfile + entrypoint.
# Server code never changes.

task_types:

  gremlin:
    display_name: "PSSM-GREMLIN"
    docker_image: "revodesign-revocompute-runner"
    command: ["bash", "/app/revocompute/run.sh"]
    input_extension: ".fasta"
    input_label: "FASTA file"
    stage_markers:
      hhblits: "HHblits MSA generation"
      hhfilter: "HHfilter filtering"
      gremlin: "GREMLIN optimization"
      blast: "PSI-BLAST PSSM"
    result_patterns: ["*.pkl", "*_ascii_mtx_file", "*.GREMLIN.mrf.pkl"]
    params:
      - name: "iter"
        type: "int"
        default: 100
        description: "GREMLIN optimization iterations"

  pythia_ddg:
    display_name: "Pythia-ddG"
    docker_image: "revodesign-revocompute-runner-pythia_ddg"
    command: ["bash", "/app/revocompute/run.sh"]
    input_extension: ".pdb"
    input_label: "PDB file"
    stage_markers:
      pythia_ddg: "Pythia masked ddG scan"
    result_patterns: ["*_pred_mask.csv", "*_pred_mask.txt"]
    params: []

  esm_fold:
    display_name: "ESMFold"
    docker_image: "revodesign-revocompute-runner-esm"
    command: ["bash", "/app/revocompute/run.sh"]
    gpus: true
    input_extension: ".fasta"
    input_label: "FASTA file"
    stage_markers:
      esm_fold: "ESMFold structure prediction"
    result_patterns: ["*.pdb"]
    params:
      - name: "num_recycles"
        type: "int"
        default: 4
        description: "ESMFold recycling iterations"
      - name: "max_tokens_per_batch"
        type: "int"
        default: 1024
        description: "Max tokens per GPU batch"
      - name: "chunk_size"
        type: "int"
        default: 128
        description: "Axial attention chunk size"

  esm_extract:
    display_name: "ESM-2 Embedding"
    docker_image: "revodesign-revocompute-runner-esm"
    command: ["bash", "/app/revocompute/run.sh"]
    gpus: true
    input_extension: ".fasta"
    input_label: "FASTA file"
    stage_markers:
      esm_extract: "ESM-2 embedding extraction"
    result_patterns: ["*.pt"]
    params:
      - name: "model"
        type: "str"
        default: "esm2_t33_650M_UR50D"
        description: "ESM-2 model name"
      - name: "repr_layers"
        type: "str"
        default: "33"
        description: "Representation layers (space-separated)"

  esm_1v:
    display_name: "ESM-1v Scoring"
    docker_image: "revodesign-revocompute-runner-esm"
    command: ["bash", "/app/revocompute/run.sh"]
    gpus: true
    input_extension: ".fasta"
    input_label: "FASTA file"
    stage_markers:
      esm_1v: "ESM-1v variant effect prediction"
    result_patterns: ["*.csv"]
    params:
      - name: "scoring_strategy"
        type: "str"
        default: "wt-marginals"
        description: "Scoring strategy (wt-marginals, masked-marginals, pseudo-ppl)"

  esm_if1:
    display_name: "ESM-IF1 Design"
    docker_image: "revodesign-revocompute-runner-esm"
    command: ["bash", "/app/revocompute/run.sh"]
    gpus: true
    input_extension: ".pdb"
    input_label: "PDB file"
    stage_markers:
      esm_if1: "ESM-IF1 inverse folding"
    result_patterns: ["*.fasta"]
    params:
      - name: "temperature"
        type: "float"
        default: 1.0
        description: "Sampling temperature"
      - name: "num_samples"
        type: "int"
        default: 1
        description: "Number of sequences to sample"

  opendde:
    display_name: "OpenDDE"
    docker_image: "revodesign-revocompute-runner-opendde"
    command: ["bash", "/app/revocompute/run.sh"]
    gpus: true
    input_extension: ".json"
    input_label: "JSON file (OpenDDE job spec)"
    stage_markers:
      opendde: "OpenDDE co-folding inference"
    result_patterns: ["*"]
    params:
      - name: "model_name"
        type: "str"
        default: "opendde_v1"
        description: "Model name (opendde_v1 or opendde_abag)"
      - name: "num_samples"
        type: "int"
        default: 1
        description: "Number of samples per seed"
      - name: "num_steps"
        type: "int"
        default: 200
        description: "Inference steps"
      - name: "num_cycles"
        type: "int"
        default: 10
        description: "Recycling cycles"
      - name: "use_msa"
        type: "bool"
        default: true
        description: "Enable MSA searching (needs network + search DBs)"
      - name: "use_template"
        type: "bool"
        default: true
        description: "Enable template searching"

  hypermpnn:
    display_name: "HyperMPNN"
    docker_image: "revodesign-revocompute-runner-mpnn"
    command: ["bash", "/app/revocompute/run.sh"]
    input_extension: ".pdb"
    input_label: "PDB file"
    stage_markers:
      hypermpnn: "HyperMPNN thermostable design"
    result_patterns: ["*.fasta"]
    params:
      - name: "num_seq"
        type: "int"
        default: 100
        description: "Number of sequences to design"
      - name: "sampling_temp"
        type: "float"
        default: 0.1
        description: "Sampling temperature"

  ligandmpnn:
    display_name: "LigandMPNN"
    docker_image: "revodesign-revocompute-runner-mpnn"
    command: ["bash", "/app/revocompute/run.sh"]
    input_extension: ".pdb"
    input_label: "PDB file"
    stage_markers:
      ligandmpnn: "LigandMPNN sequence design"
    result_patterns: ["*.fasta"]
    params:
      - name: "num_seq"
        type: "int"
        default: 100
        description: "Number of sequences per target"
      - name: "sampling_temp"
        type: "float"
        default: 0.1
        description: "Sampling temperature"

  thermompnn:
    display_name: "ThermoMPNN-D"
    docker_image: "revodesign-revocompute-runner-mpnn"
    command: ["bash", "/app/revocompute/run.sh"]
    input_extension: ".pdb"
    input_label: "PDB file"
    stage_markers:
      thermompnn: "ThermoMPNN-D stability prediction"
    result_patterns: ["*.csv"]
    params:
      - name: "chains"
        type: "str"
        default: "A"
        description: "Chain IDs to analyze"
      - name: "mode"
        type: "str"
        default: "single"
        description: "single, additive, or epistatic"

  prime:
    display_name: "Pro-Prime"
    docker_image: "revodesign-revocompute-runner-prime"
    command: ["bash", "/app/revocompute/run.sh"]
    gpus: true
    input_extension: ".fasta"
    input_label: "FASTA file"
    stage_markers:
      prime: "Pro-Prime OGT prediction"
    result_patterns: ["*.csv"]
    params: []

  rfdiffusion:
    display_name: "RFdiffusion"
    docker_image: "revodesign-revocompute-runner-rfdiffusion"
    command: ["bash", "/app/revocompute/run.sh"]
    gpus: true
    input_extension: ".pdb"
    input_label: "PDB file"
    stage_markers:
      rfdiffusion: "RFdiffusion backbone generation"
    result_patterns: ["*.pdb", "*.trb"]
    params:
      - name: "contig"
        type: "str"
        default: "100-100"
        description: "Contig string (e.g. 100-100 for monomer, 5-15/A10-25 for motif)"
      - name: "num_designs"
        type: "int"
        default: 10
        description: "Number of designs to generate"
