    entrypoint: ["bash", "/app/revocompute/run.sh"]
    dockerfile: "docker/runners/prime/Dockerfile"
    definition: "docker/runners/prime/prime.def"
    slurm_image: "/mnt/data/srv/revodesign/server-slurm/images/prime_v1.sif"
  placer-rfdiffusion:
    docker_image: "revodesign-revocompute-runner-placer-rfdiffusion"
    entrypoint: ["bash", "/app/revocompute/run.sh"]
    dockerfile: "docker/runners/placer-rfdiffusion/Dockerfile"
    definition: "docker/runners/placer-rfdiffusion/placer-rfdiffusion.def"
    slurm_image: "/mnt/data/srv/revodesign/server-slurm/images/placer-rfdiffusion_v1.sif"
  bioemu:
    docker_image: "revodesign-revocompute-runner-bioemu"
    entrypoint: ["bash", "/app/revocompute/run.sh"]
    dockerfile: "docker/runners/bioemu/Dockerfile"
    definition: "docker/runners/bioemu/bioemu.def"
    slurm_image: "/mnt/data/srv/revodesign/server-slurm/images/bioemu_v1.sif"
  easifa:
    docker_image: "revodesign-revocompute-runner-easifa"
    entrypoint: ["bash", "/app/revocompute/run.sh"]
    dockerfile: "docker/runners/easifa/Dockerfile"
    definition: "docker/runners/easifa/easifa.def"
    slurm_image: "/mnt/data/srv/revodesign/server-slurm/images/easifa_v1.sif"
  freebindcraft:
    docker_image: "revodesign-revocompute-runner-freebindcraft"
    entrypoint: ["bash", "/app/revocompute/run.sh"]
    dockerfile: "docker/runners/freebindcraft/Dockerfile"
    definition: "docker/runners/freebindcraft/freebindcraft.def"
    slurm_image: "/mnt/data/srv/revodesign/server-slurm/images/freebindcraft_v1.sif"
  alphafold:
    docker_image: "revodesign-revocompute-runner-alphafold"
    entrypoint: ["bash", "/app/revocompute/run.sh"]
    dockerfile: "docker/runners/alphafold/Dockerfile"
    definition: "docker/runners/alphafold/alphafold.def"
    slurm_image: "/mnt/data/srv/revodesign/server-slurm/images/alphafold_v1.sif"
  colabfold_af2:
    docker_image: "revodesign-revocompute-runner-colabfold_af2"
