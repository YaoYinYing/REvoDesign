    slurm_image: "/mnt/data/srv/revodesign/server-slurm/images/opendde_v1.sif"
  mpnn:
    docker_image: "revodesign-revocompute-runner-mpnn"
    entrypoint: ["bash", "/app/revocompute/run.sh"]
    dockerfile: "docker/runners/mpnn/Dockerfile"
