    definition: "docker/runners/colabfold_af2/colabfold_af2.def"
    slurm_image: "/mnt/data/srv/revodesign/server-slurm/images/colabfold_af2_v1.sif"

categories:
  evolution: {label: "Understand evolution", description: "Find conservation, co-evolution, and learned sequence representations.", order: 10}
  structure: {label: "Predict or explore structure", description: "Predict folds, complexes, dynamics, or conformational ensembles.", order: 20}
  fitness: {label: "Evaluate variants", description: "Estimate stability, fitness, and sequence-level properties.", order: 30}
  function: {label: "Annotate function", description: "Locate functional residues and add biochemical context.", order: 40}
  inverse_folding: {label: "Design sequences", description: "Design or score sequences against a supplied structure.", order: 50}
  design: {label: "Generate new designs", description: "Generate backbones or complete binder-design campaigns.", order: 60}

workspace_templates:
  file: &file_workspace
    steps:
      - {id: "material", title: "Provide the input", description: "Choose the scientific input consumed by this method", capabilities: [{plugin: "files", id: "source_files", title: "Input files", options: {primary_required: true}}]}
      - {id: "settings", title: "Set the experiment", description: "Adjust only the controls that matter for this run", capabilities: [{plugin: "parameters", id: "task_parameters", title: "Method settings"}]}
      - {id: "review", title: "Review and run", description: "Check the input and settings before creating the task snapshot", capabilities: [{plugin: "review", id: "submission_review", title: "Experiment review", options: {show_paths: true}}]}
  fasta: &fasta_workspace
    steps:
      - id: "material"
        title: "Provide the protein sequence"
        description: "Upload FASTA files or paste one protein sequence"
        capabilities:
          - {plugin: "files", id: "source_files", title: "Sequence files", options: {primary_required: true}}
          - {plugin: "sequence", id: "sequence_editor", title: "Paste a sequence"}
      - {id: "settings", title: "Set the experiment", description: "Adjust only the controls that matter for this run", capabilities: [{plugin: "parameters", id: "task_parameters", title: "Method settings"}]}
      - {id: "review", title: "Review and run", description: "Check the sequence and settings before creating the task snapshot", capabilities: [{plugin: "review", id: "submission_review", title: "Experiment review", options: {show_paths: true}}]}
  structure: &structure_workspace
    steps:
      - id: "material"
        title: "Provide the structure"
        description: "Choose the structure that defines the molecular context"
        capabilities:
          - {plugin: "files", id: "source_files", title: "Structure files", options: {primary_required: true}}
          - {plugin: "structure", id: "structure_summary", title: "Inspect the structure", options: {source: "source_files", select_chains: false, select_residues: false}}
      - {id: "settings", title: "Set the experiment", description: "Define the design or analysis settings", capabilities: [{plugin: "parameters", id: "task_parameters", title: "Method settings"}]}
      - {id: "review", title: "Review and run", description: "Check the structure and settings before creating the task snapshot", capabilities: [{plugin: "review", id: "submission_review", title: "Experiment review", options: {show_paths: true}}]}

task_types:

  gremlin:
    display_name: "PSSM-GREMLIN"
    category: evolution
    summary: Sequence conservation (PSI-BLAST PSSM) and co-evolutionary couplings (GREMLIN) for a protein sequence.
    use_when: Use this to identify conserved positions and co-evolving residue pairs from one protein sequence.
    input_summary: One protein sequence as FASTA, either uploaded or pasted.
    output_summary: A multiple-sequence alignment, a PSI-BLAST position-specific scoring matrix, and GREMLIN coupling data.
    considerations:
      - Results depend on homolog coverage in the configured sequence databases.
    runtime_family: "gremlin"
    input_extension: ".fasta"
    input_label: "FASTA file"
    input_workspace:
      steps:
      - id: material
        title: Provide the input
        description: Choose the scientific input for this experiment
        capabilities:
        - plugin: files
          id: source_files
          title: FASTA input
          options:
            primary_required: true
        - plugin: sequence
          id: sequence_editor
          title: Sequence
          description: Upload a FASTA file or paste one protein sequence.
      - id: settings
        title: Set the experiment
        description: Adjust only the controls that matter for this run
        capabilities:
        - plugin: parameters
          id: task_parameters
          title: GREMLIN settings
      - id: review
        title: Review and run
        description: Check the input and settings before creating the task snapshot
        capabilities:
        - plugin: review
          id: submission_review
          title: Review
          options:
            show_paths: true
    result_workspace:
      views:
        - plugin: evidence-bundle
          id: evolutionary_evidence
          role: primary
          title: Evolutionary evidence
          description: Alignment, position-specific scoring, and co-evolution evidence produced for the submitted sequence.
          sources:
            items:
              - {glob: "gremlin_msa/*.i90c75.a3m", required: true}
              - {glob: "pssm_msa/*_ascii_mtx_file", required: true}
              - {glob: "gremlin_res/*_GREMLIN_mtx.png", required: true}
          mapping: {}
    stage_markers:
      hhblits: "HHblits MSA generation"
      hhfilter: "HHfilter filtering"
      gremlin: "GREMLIN optimization"
      blast: "PSI-BLAST PSSM"
    params:
      - name: "iter"
        type: "int"
        default: 100
        description: "GREMLIN optimization iterations"
        help: "Number of gradient-descent iterations the GREMLIN Markov random field model runs during training. Higher values (e.g. 500–1000) can yield more converged coupling scores at the cost of longer runtime, while lower values (50–100) produce a faster but rougher model. Typical values for production runs are 100–200."
        minimum: 1
        maximum: 10000
        step: 1
        advanced: true
      - name: "evalue"
        type: "str"
        default: "1E-10"
        description: "HHblits E-value significance threshold (lower = more stringent)"
        help: "The E-value controls which sequence matches HHblits considers statistically significant during iterative profile construction. A lower threshold (e.g. 1E-20) admits only near-identical homologs and produces a tighter, less diverse alignment; a higher threshold (e.g. 1E-4) brings in remote homologs and increases sequence diversity. The default 1E-10 balances coverage and quality for most protein families."
        advanced: true
      - name: "mact"
        type: "float"
        default: 0.35
        description: "HHblits posterior probability threshold for alignment columns [0–1]"
        help: "The mact (maximum accuracy) parameter determines how conservative the column inclusion is in the output alignment. Values near 1.0 keep only high-confidence columns, producing a shorter but more reliable MSA. Values near 0.0 include nearly every column regardless of quality, which adds noise but preserves more sequence information. The default 0.35 is a broadly accepted trade-off."
        minimum: 0.0
        maximum: 1.0
        step: 0.05
        advanced: true
      - name: "maxfilt"
        type: "int"
        default: 100000000
        description: "HHblits maximum hits through prefilter"
        help: "The maximum number of raw database hits that pass through the HHblits prefilter before the more expensive alignment stage. A very high value (default 100 million) effectively disables the cap and lets all candidates through. Lower this if you observe excessive memory use or wall-clock time during the HHblits stage — values around 1–10 million are sufficient for most single-domain proteins while dramatically reducing resource consumption."
        minimum: 1
        advanced: true
      - name: "neffmax"
        type: "float"
        default: 20.0
        description: "HHblits target effective sequences after diversity filtering"
        help: "The target number of effective (non-redundant) sequences HHblits aims to retain after its diversity-filtering stage. Higher values (e.g. 50–100) produce a deeper, more informative MSA that improves GREMLIN contact prediction but scales computation quadratically. Lower values (5–10) run faster but may miss co-evolutionary signal from underrepresented clades. The default 20 is typical for most medium-sized protein families."
        minimum: 1.0
        advanced: true
      - name: "num_iterations"
        type: "int"
        default: 3
        description: "PSI-BLAST search iterations for PSSM refinement"
        help: "Number of PSI-BLAST rounds used to build the position-specific scoring matrix (PSSM). Each iteration re-searches the database using the profile from the previous round, progressively refining the PSSM. Fewer iterations (1–2) produce a coarser but faster PSSM; more iterations (5–10) may pull in spurious hits and dilute the profile. The default of 3 is the NCBI-recommended value and works well for most queries."
        minimum: 1
        maximum: 10
        step: 1
        advanced: true

  pythia_ddg:
    display_name: "Pythia-ddG"
    category: fitness
    summary: Masked-mutation stability (ΔΔG) scan of a PDB structure.
    use_when: Use this for a structure-wide computational scan of mutation-associated stability changes.
    input_summary: One protein structure in PDB format.
    output_summary: Predicted stability-change scores for substitutions across the supplied structure.
    considerations:
      - Predicted ΔΔG values are computational estimates and require experimental interpretation.
    runtime_family: "pythia_ddg"
    input_extension: ".pdb"
    input_label: "PDB file"
    input_workspace: *structure_workspace
    stage_markers:
      pythia_ddg: "Pythia masked ddG scan"
    params: []

  esm_msa:
    display_name: "ESM-MSA-1b Variant Effect"
    category: evolution
    summary: Per-position variant-effect profile from an MSA via ESM-MSA-1b.
    use_when: Use this when you already have an A3M alignment and want a residue-level variant-effect profile.
    input_summary: One A3M multiple-sequence alignment; the configured row limit selects the first sequences.
    output_summary: A table of per-position ESM-MSA-1b masked-marginal scores.
    considerations:
      - Alignment composition and the selected row count affect the profile.
    runtime_family: "esm"
    gpus: true
    input_extension: ".a3m"
    input_label: "Multiple sequence alignment (a3m)"
    input_workspace: *file_workspace
    stage_markers:
      esm_msa: "ESM-MSA-1b masked-marginal profile"
    params:
      - name: "msa_samples"
        type: "int"
        default: 32
        description: "MSA rows to load (first N sequences)"
        minimum: 1
        maximum: 256
        step: 1

  esm_extract:
    display_name: "ESM-2 Embedding"
    category: evolution
    summary: ESM-2 embeddings, contacts, and logits from a sequence.
    use_when: Use this to generate ESM-2 representations for downstream sequence analysis.
    input_summary: One protein sequence as FASTA.
    output_summary: Requested ESM-2 representations and optional contact predictions.
    considerations:
      - The configured truncation length limits how many residues are retained.
    runtime_family: "esm"
    gpus: true
    input_extension: ".fasta"
    input_label: "FASTA file"
    input_workspace: *fasta_workspace
    stage_markers:
      esm_extract: "ESM-2 embedding extraction"
    params:
      - name: "model"
        type: "str"
        default: "esm2_t33_650M_UR50D"
        description: "ESM-2 model name"
      - name: "repr_layers"
        type: "str"
        default: "33"
        description: "Representation layers (space-separated)"
      - {name: "include", type: "str", default: "mean per_tok", description: "Space-separated outputs: mean, per_tok, bos, contacts"}
      - {name: "toks_per_batch", type: "int", default: 4096, minimum: 1, description: "Maximum tokens per inference batch", advanced: true}
      - {name: "truncation_seq_length", type: "int", default: 1022, minimum: 1, description: "Maximum residues retained from each sequence", advanced: true}

  esm_1v:
    display_name: "ESM-1v Scoring"
    category: fitness
    summary: Zero-shot variant effect scores from ESM-1v.
    use_when: Use this for sequence-only, zero-shot prioritization of single amino-acid substitutions.
    input_summary: One protein sequence as FASTA.
    output_summary: A table of ESM-1v scores for possible substitutions.
    considerations:
      - Scores prioritize variants computationally and are not experimental fitness measurements.
    runtime_family: "esm"
    gpus: true
    input_extension: ".fasta"
    input_label: "FASTA file"
    input_workspace: *fasta_workspace
    stage_markers:
      esm_1v: "ESM-1v variant effect prediction"
    params: []

  esm_if1:
    display_name: "ESM-IF1 Design"
    category: inverse_folding
    summary: Inverse folding — design sequences that fold to a given backbone.
    use_when: Use this to propose sequences compatible with a known protein backbone.
    input_summary: One protein backbone in PDB format and the chain to redesign.
    output_summary: Sampled protein sequences for the selected backbone chain.
    considerations:
      - The selected chain and sampling temperature materially affect generated sequences.
    runtime_family: "esm"
    gpus: true
    input_extension: ".pdb"
    input_label: "PDB file"
    input_workspace: *structure_workspace
    stage_markers:
      esm_if1: "ESM-IF1 inverse folding"
    params:
      - name: "temperature"
        type: "float"
        default: 1.0
        description: "Sampling temperature"
        minimum: 0.0001
        step: 0.05
      - name: "num_samples"
        type: "int"
        default: 1
        description: "Number of sequences to sample"
        minimum: 1
        step: 1
      - {name: "chain", type: "str", default: "A", description: "Backbone chain to redesign", advanced: true}

  esmdynamic:
    display_name: "ESMDynamic"
    category: structure
    citation_dois:
      - {num: 1, doi: "10.1101/2025.08.20.671365", title: "ESMDynamic: A Fast and Accurate Prediction of Protein Dynamic Contact Maps from Single Sequences"}
    citation_bibtex: |
      @article{Kleiman2025.08.20.671365, author={Kleiman, Diego E and Feng, Jiangyan and Xue, Zhengyuan and Shukla, Diwakar}, title={ESMDynamic: A Fast and Accurate Prediction of Protein Dynamic Contact Maps from Single Sequences}, elocation-id={2025.08.20.671365}, year={2026}, doi={10.1101/2025.08.20.671365}, publisher={Cold Spring Harbor Laboratory}, URL={https://www.biorxiv.org/content/early/2026/04/21/2025.08.20.671365}, eprint={https://www.biorxiv.org/content/early/2026/04/21/2025.08.20.671365.full.pdf}, journal={bioRxiv}}
    summary: Predict protein dynamic contact maps, contact frequencies, and kinetics from a sequence.
    use_when: Use this to estimate residue-contact dynamics directly from a protein sequence.
    input_summary: One protein sequence as FASTA.
    output_summary: Predicted dynamic contact maps, contact frequencies, and kinetic outputs.
    considerations:
      - Outputs are model predictions from sequence rather than a molecular-dynamics trajectory.
    runtime_family: "esmdynamic"
    gpus: true
    input_extension: ".fasta"
    input_label: "FASTA file"
    input_workspace: *fasta_workspace
    stage_markers:
      esmdynamic: "ESMDynamic contact-map prediction"
    params:
      - {name: "batch_size", type: "int", default: 1, minimum: 1, description: "Sequences per inference batch", advanced: true}
      - {name: "chunk_size", type: "int", default: 256, minimum: 1, description: "Model chunk size", advanced: true}
      - {name: "low_memory", type: "bool", default: false, description: "Run prediction heads sequentially to reduce memory use", advanced: true}
      - {name: "num_recycles", type: "int", default: null, minimum: 1, description: "Optional model recycle count", advanced: true}

  opendde:
    display_name: "OpenDDE"
    category: structure
    summary: All-atom structure prediction with MSA and template guidance (OpenDDE).
    use_when: Use this for OpenDDE co-folding jobs that need an explicit JSON specification.
    input_summary: One OpenDDE JSON job specification describing the molecular system.
    output_summary: Predicted all-atom structures and model confidence outputs produced by OpenDDE.
    considerations:
      - The JSON schema and optional MSA/template settings must match the pinned OpenDDE runner.
    runtime_family: "opendde"
    gpus: true
    input_extension: ".json"
    input_label: "JSON file (OpenDDE job spec)"
    input_workspace: *file_workspace
    stage_markers:
      opendde: "OpenDDE co-folding inference"
    params:
      - name: "model_name"
        type: "str"
        default: "opendde_v1"
        description: "Model name (opendde_v1 or opendde_abag)"
        choices: ["opendde_v1", "opendde_abag"]
      - name: "num_samples"
        type: "int"
        default: 1
        description: "Number of samples per seed"
      - name: "num_steps"
        type: "int"
        default: 200
        description: "Inference steps"
      - name: "num_cycles"
        type: "int"
        default: 10
        description: "Recycling cycles"
      - name: "use_msa"
        type: "bool"
        default: true
        description: "Enable MSA searching (needs network + search DBs)"
      - name: "use_template"
        type: "bool"
        default: true
        description: "Enable template searching"
      - {name: "seeds", type: "str", default: "", description: "Optional comma-separated random seeds", advanced: true}
      - {name: "dtype", type: "str", default: "fp32", choices: ["fp32", "bf16"], description: "Inference numeric precision", advanced: true}
      - {name: "use_default_params", type: "bool", default: false, description: "Reset cycles and steps to model defaults", advanced: true}
      - {name: "enable_cache", type: "bool", default: true, description: "Cache diffusion shared variables", advanced: true}
      - {name: "enable_tf32", type: "bool", default: true, description: "Allow TF32 matrix multiplication", advanced: true}
      - {name: "deterministic", type: "bool", default: false, description: "Enable deterministic PyTorch algorithms", advanced: true}
      - {name: "need_atom_confidence", type: "bool", default: true, description: "Calculate atom-level confidence scores", advanced: true}
      - {name: "use_tfg_guidance", type: "bool", default: false, description: "Enable training-free guidance", advanced: true}

  hypermpnn:
    display_name: "HyperMPNN"
    category: inverse_folding
    summary: Thermostable sequence design using hyperthermophile-trained ProteinMPNN weights (HyperMPNN).
    use_when: Use this to sample backbone-compatible sequences with HyperMPNN weights trained on hyperthermophile proteins.
    input_summary: One protein backbone in PDB format.
    output_summary: Designed FASTA sequences and optional scores or probabilities.
    considerations:
      - Hyperthermophile-biased weights are a design prior, not a guarantee of thermostability.
    runtime_family: "mpnn"
    input_extension: ".pdb"
    input_label: "PDB file"
    input_workspace: *structure_workspace
    stage_markers:
      hypermpnn: "HyperMPNN thermostable design"
    params:
      - name: "num_seq_per_target"
        type: "int"
        default: 100
        description: "Number of sequences to design"
        minimum: 1
        maximum: 10000
      - name: "sampling_temp"
        type: "str"
        default: "0.1"
        description: "Space-separated sampling temperatures, e.g. 0.1 0.2"
      - {name: "batch_size", type: "int", default: 1, minimum: 1, description: "Sequences generated per model pass"}
      - {name: "seed", type: "int", default: 0, minimum: 0, description: "Random seed; 0 selects a random seed"}
      - {name: "pdb_path_chains", type: "str", default: "", description: "Space-separated chains to design", advanced: true}
      - {name: "backbone_noise", type: "float", default: 0.0, minimum: 0, description: "Gaussian backbone coordinate noise", unit: "Å", advanced: true}
      - {name: "max_length", type: "int", default: 200000, minimum: 1, description: "Maximum parsed sequence length", advanced: true}
      - {name: "omit_AAs", type: "str", default: "X", description: "Amino acids to omit from generated sequences", advanced: true}
      - {name: "save_score", type: "int", default: 0, choices: [0, 1], description: "Save per-sequence scores", advanced: true}
      - {name: "save_probs", type: "int", default: 0, choices: [0, 1], description: "Save predicted residue probabilities", advanced: true}
      - {name: "score_only", type: "int", default: 0, choices: [0, 1], description: "Score the input backbone-sequence pair without design", advanced: true}
      - {name: "conditional_probs_only", type: "int", default: 0, choices: [0, 1], description: "Output conditional probabilities given the remaining sequence", advanced: true}
      - {name: "conditional_probs_only_backbone", type: "int", default: 0, choices: [0, 1], description: "Output conditional probabilities given backbone only", advanced: true}
      - {name: "unconditional_probs_only", type: "int", default: 0, choices: [0, 1], description: "Output unconditional probabilities given backbone", advanced: true}
      - {name: "suppress_print", type: "int", default: 0, choices: [0, 1], description: "Suppress upstream progress output", advanced: true}

  proteinmpnn:
    display_name: "ProteinMPNN"
    category: inverse_folding
    summary: ProteinMPNN sequence design for the given backbone.
    use_when: Use this for general sequence design conditioned on a supplied protein backbone.
    input_summary: One protein backbone in PDB format.
    output_summary: Designed FASTA sequences and optional scores or residue probabilities.
    considerations:
      - Generated sequences require structural and experimental evaluation.
    runtime_family: "mpnn"
    input_extension: ".pdb"
    input_label: "Protein backbone (PDB)"
    input_workspace: *structure_workspace
    stage_markers:
      proteinmpnn: "ProteinMPNN sequence design"
    params:
      - {name: "num_seq_per_target", type: "int", default: 100, minimum: 1, maximum: 10000, description: "Number of sequences to design"}
      - {name: "sampling_temp", type: "str", default: "0.1", description: "Space-separated sampling temperatures, e.g. 0.1 0.2"}
      - {name: "model_name", type: "str", default: "v_48_020", choices: ["v_48_002", "v_48_010", "v_48_020", "v_48_030"], description: "Official ProteinMPNN checkpoint"}
      - {name: "batch_size", type: "int", default: 1, minimum: 1, description: "Sequences generated per model pass"}
      - {name: "seed", type: "int", default: 0, minimum: 0, description: "Random seed; 0 selects a random seed"}
      - {name: "pdb_path_chains", type: "str", default: "", description: "Space-separated chains to design", advanced: true}
      - {name: "ca_only", type: "bool", default: false, description: "Use the official CA-only ProteinMPNN model", advanced: true}
      - {name: "backbone_noise", type: "float", default: 0.0, minimum: 0, description: "Gaussian backbone coordinate noise", unit: "Å", advanced: true}
      - {name: "max_length", type: "int", default: 200000, minimum: 1, description: "Maximum parsed sequence length", advanced: true}
      - {name: "omit_AAs", type: "str", default: "X", description: "Amino acids to omit from generated sequences", advanced: true}
      - {name: "save_score", type: "int", default: 0, choices: [0, 1], description: "Save per-sequence scores", advanced: true}
      - {name: "save_probs", type: "int", default: 0, choices: [0, 1], description: "Save predicted residue probabilities", advanced: true}
      - {name: "score_only", type: "int", default: 0, choices: [0, 1], description: "Score the input backbone-sequence pair without design", advanced: true}
      - {name: "conditional_probs_only", type: "int", default: 0, choices: [0, 1], description: "Output conditional probabilities given the remaining sequence", advanced: true}
      - {name: "conditional_probs_only_backbone", type: "int", default: 0, choices: [0, 1], description: "Output conditional probabilities given backbone only", advanced: true}
      - {name: "unconditional_probs_only", type: "int", default: 0, choices: [0, 1], description: "Output unconditional probabilities given backbone", advanced: true}
      - {name: "suppress_print", type: "int", default: 0, choices: [0, 1], description: "Suppress upstream progress output", advanced: true}

  solublempnn:
    display_name: "SolubleMPNN"
    category: inverse_folding
    summary: Solubility-aware ProteinMPNN sequence design.
    use_when: Use this when sequence design should use ProteinMPNN checkpoints tuned for soluble proteins.
    input_summary: One soluble-protein backbone in PDB format.
    output_summary: Designed FASTA sequences from a soluble-protein checkpoint.
    considerations:
      - The soluble-protein prior does not guarantee expression or solubility.
    runtime_family: "mpnn"
    input_extension: ".pdb"
    input_label: "Soluble protein backbone (PDB)"
    input_workspace: *structure_workspace
    stage_markers:
      solublempnn: "SolubleMPNN sequence design"
    params:
      - {name: "num_seq_per_target", type: "int", default: 100, minimum: 1, maximum: 10000, description: "Number of sequences to design"}
      - {name: "sampling_temp", type: "str", default: "0.1", description: "Space-separated sampling temperatures, e.g. 0.1 0.2"}
      - {name: "model_name", type: "str", default: "v_48_020", choices: ["v_48_010", "v_48_020"], description: "Official soluble-protein checkpoint"}
      - {name: "batch_size", type: "int", default: 1, minimum: 1, description: "Sequences generated per model pass"}
      - {name: "seed", type: "int", default: 0, minimum: 0, description: "Random seed; 0 selects a random seed"}
      - {name: "pdb_path_chains", type: "str", default: "", description: "Space-separated chains to design", advanced: true}
      - {name: "backbone_noise", type: "float", default: 0.0, minimum: 0, description: "Gaussian backbone coordinate noise", unit: "Å", advanced: true}
      - {name: "max_length", type: "int", default: 200000, minimum: 1, description: "Maximum parsed sequence length", advanced: true}
      - {name: "omit_AAs", type: "str", default: "X", description: "Amino acids to omit from generated sequences", advanced: true}
      - {name: "save_score", type: "int", default: 0, choices: [0, 1], description: "Save per-sequence scores", advanced: true}
      - {name: "save_probs", type: "int", default: 0, choices: [0, 1], description: "Save predicted residue probabilities", advanced: true}
      - {name: "score_only", type: "int", default: 0, choices: [0, 1], description: "Score the input backbone-sequence pair without design", advanced: true}
      - {name: "conditional_probs_only", type: "int", default: 0, choices: [0, 1], description: "Output conditional probabilities given the remaining sequence", advanced: true}
      - {name: "conditional_probs_only_backbone", type: "int", default: 0, choices: [0, 1], description: "Output conditional probabilities given backbone only", advanced: true}
      - {name: "unconditional_probs_only", type: "int", default: 0, choices: [0, 1], description: "Output unconditional probabilities given backbone", advanced: true}
      - {name: "suppress_print", type: "int", default: 0, choices: [0, 1], description: "Suppress upstream progress output", advanced: true}

  ligandmpnn:
    display_name: "LigandMPNN"
    category: inverse_folding
    summary: Ligand-aware sequence design (LigandMPNN).
    use_when: Use this to design residues in the context of a bound ligand and optionally pack side chains.
    input_summary: One PDB structure containing the protein and relevant ligand context.
    output_summary: Designed sequences, with optional packed structures and model statistics.
    considerations:
      - Ligand identity, atom records, residue syntax, and structure preparation affect the design context.
    runtime_family: "mpnn"
    input_extension: ".pdb"
    input_label: "PDB file"
    input_workspace: *structure_workspace
    stage_markers:
      ligandmpnn: "LigandMPNN sequence design"
    params:
      - name: "number_of_batches"
        type: "int"
        default: 100
        description: "Number of model passes; total sequences equal batches × batch size"
        minimum: 1
        maximum: 10000
      - name: "sampling_temp"
        type: "float"
        default: 0.1
        description: "Sampling temperature"
        minimum: 0.0001
      - {name: "batch_size", type: "int", default: 1, minimum: 1, description: "Sequences generated per model pass"}
      - {name: "seed", type: "int", default: 0, minimum: 0, description: "Random seed; 0 selects a random seed"}
      - {name: "chains_to_design", type: "str", default: "", description: "Comma-separated chains to redesign", advanced: true}
      - {name: "parse_these_chains_only", type: "str", default: "", description: "Comma-separated chains to parse", advanced: true}
      - {name: "fixed_residues", type: "str", default: "", description: "Space-separated fixed residues, e.g. A12 A13 B2", advanced: true}
      - {name: "redesigned_residues", type: "str", default: "", description: "Space-separated residues to redesign", advanced: true}
      - {name: "bias_AA", type: "str", default: "", description: "Amino-acid bias, e.g. A:-1.0,P:2.0", advanced: true}
      - {name: "omit_AA", type: "str", default: "", description: "Amino acids to omit, e.g. C", advanced: true}
      - {name: "symmetry_residues", type: "str", default: "", description: "Symmetric residue groups in LigandMPNN syntax", advanced: true}
      - {name: "symmetry_weights", type: "str", default: "", description: "Weights matching symmetry residue groups", advanced: true}
      - {name: "homo_oligomer", type: "int", default: 0, choices: [0, 1], description: "Apply equal-weight homo-oligomer symmetry", advanced: true}
      - {name: "fasta_seq_separation", type: "str", default: ":", description: "Chain separator in output FASTA", advanced: true}
      - {name: "zero_indexed", type: "int", default: 0, choices: [0, 1], description: "Use zero-based residue numbering in output", advanced: true}
      - {name: "verbose", type: "int", default: 1, choices: [0, 1], description: "Include upstream progress output", advanced: true}
      - {name: "save_stats", type: "int", default: 0, choices: [0, 1], description: "Save upstream statistics", advanced: true}
      - {name: "ligand_mpnn_use_atom_context", type: "int", default: 1, choices: [0, 1], description: "Use ligand atom context", advanced: true}
      - {name: "ligand_mpnn_cutoff_for_score", type: "float", default: 8.0, minimum: 0, unit: "Å", description: "Ligand-context scoring cutoff", advanced: true}
      - {name: "ligand_mpnn_use_side_chain_context", type: "int", default: 0, choices: [0, 1], description: "Use fixed-residue side chains as ligand context", advanced: true}
      - {name: "parse_atoms_with_zero_occupancy", type: "int", default: 0, choices: [0, 1], description: "Parse atoms with zero occupancy", advanced: true}
      - {name: "pack_side_chains", type: "int", default: 0, choices: [0, 1], description: "Run the LigandMPNN side-chain packer", advanced: true}
      - {name: "number_of_packs_per_design", type: "int", default: 4, minimum: 1, description: "Independent side-chain packing samples", advanced: true}
      - {name: "sc_num_denoising_steps", type: "int", default: 3, minimum: 1, description: "Side-chain denoising steps", advanced: true}
      - {name: "sc_num_samples", type: "int", default: 16, minimum: 1, description: "Mixture samples per side-chain step", advanced: true}
      - {name: "repack_everything", type: "int", default: 0, choices: [0, 1], description: "Repack fixed as well as designed residues", advanced: true}
      - {name: "force_hetatm", type: "int", default: 0, choices: [0, 1], description: "Write ligand atoms as HETATM after packing", advanced: true}
      - {name: "packed_suffix", type: "str", default: "_packed", description: "Suffix for packed structures", advanced: true}
      - {name: "pack_with_ligand_context", type: "int", default: 1, choices: [0, 1], description: "Use ligand context during packing", advanced: true}

  lasermpnn:
    display_name: "LASErMPNN"
    category: inverse_folding
    summary: Ligand-conditioned sequence design and sidechain packing for protonated (all-atom) structures (LASErMPNN).
    use_when: Use this for ligand-conditioned sequence and side-chain design across one or more all-atom structures.
    input_summary: One or more protonated protein–ligand structures in PDB or mmCIF format.
    output_summary: Designed structures and/or FASTA sequences according to the selected output mode.
    considerations:
      - Inputs must be all-atom and protonated for the intended LASErMPNN contract.
    runtime_family: "mpnn"
    input_extension: ".pdb"
    input_extensions: [".pdb", ".cif", ".mmcif"]
    primary_input_extensions: [".pdb", ".cif", ".mmcif"]
    allow_multiple_inputs: true
    max_input_files: 64
    input_label: "Protonated protein–ligand structures (PDB/mmCIF)"
    input_workspace: *structure_workspace
    stage_markers:
      lasermpnn: "LASErMPNN ligand-conditioned sequence and side-chain design"
    params:
      - {name: "designs_per_input", type: "int", default: 5, minimum: 1, maximum: 1000, description: "Designs generated for each uploaded structure"}
      - {name: "designs_per_batch", type: "int", default: 5, minimum: 1, maximum: 1000, description: "Designs generated in one model pass; reduce to limit memory"}
      - {name: "inputs_processed_simultaneously", type: "int", default: 1, minimum: 1, maximum: 64, description: "Uploaded structures processed together per model pass"}
      - {name: "model_checkpoint", type: "str", default: "all_data", choices: ["all_data", "paper"], description: "All-data checkpoint (current upstream default) or held-out-split checkpoint used in the paper"}
      - {name: "sequence_temp", type: "float", default: null, minimum: 0, description: "Sequence sampling temperature; blank uses the checkpoint default", advanced: true}
      - {name: "first_shell_sequence_temp", type: "float", default: null, minimum: 0, description: "Separate sequence temperature for ligand first-shell residues", advanced: true}
      - {name: "chi_temp", type: "float", default: null, minimum: 0, description: "Side-chain chi-angle sampling temperature", advanced: true}
      - {name: "chi_min_p", type: "float", default: 0.0, minimum: 0, maximum: 1, description: "Minimum chi-angle sampling probability; upstream does not recommend changing this", advanced: true}
      - {name: "seq_min_p", type: "float", default: 0.0, minimum: 0, maximum: 1, description: "Minimum sequence sampling probability; upstream does not recommend changing this", advanced: true}
      - {name: "use_water", type: "bool", default: false, description: "Treat HOH records as ligand context", advanced: true}
      - {name: "silent", type: "bool", default: false, description: "Suppress upstream status output", advanced: true}
      - {name: "disabled_residues", type: "str", default: "X,C", description: "Comma-separated residue symbols excluded from sampling", advanced: true}
      - {name: "fix_beta", type: "bool", default: false, description: "Fix residues and rotamers whose input B-factor is 1", advanced: true}
      - {name: "repack_only_input_sequence", type: "bool", default: false, description: "Keep the input sequence and only repack side chains", advanced: true}
      - {name: "ignore_ligand", type: "bool", default: false, description: "Run without ligand context", advanced: true}
      - {name: "constrain_ala_gly_sampling_to_exposed_non_secondary_structure", type: "bool", default: false, description: "Apply upstream surface ALA/GLY sampling constraints", advanced: true}
      - {name: "budget_residue_sele_string", type: "str", default: "", description: "Optional ProDy residue selection for ALA/GLY budgets", advanced: true}
      - {name: "ala_budget", type: "int", default: 4, minimum: 0, description: "Maximum ALA samples in budgeted residues", advanced: true}
      - {name: "gly_budget", type: "int", default: 0, minimum: 0, description: "Maximum GLY samples in budgeted residues", advanced: true}
      - {name: "noncanonical_aa_ligand", type: "bool", default: false, description: "Treat noncanonical amino acids as ligand atoms", advanced: true}
      - {name: "repack_all", type: "bool", default: false, description: "Repack every residue, including masked residues", advanced: true}
      - {name: "output_fasta", type: "bool", default: true, description: "Write designed FASTA sequences alongside structure outputs"}
      - {name: "output_fasta_only", type: "bool", default: false, description: "Write FASTA sequences without designed PDB structures", advanced: true}
      - {name: "fs_calc_ca_distance", type: "float", default: 10.0, minimum: 0, unit: "Å", description: "Ligand-heavy-atom to Cα cutoff for first-shell residues", advanced: true}
      - {name: "fs_calc_burial_hull_alpha_value", type: "float", default: 9.0, minimum: 0, description: "Alpha-hull value used for first-shell burial", advanced: true}
      - {name: "fs_no_calc_burial", type: "bool", default: false, description: "Select first-shell residues by distance without burial filtering", advanced: true}
      - {name: "disable_charged_fs", type: "bool", default: false, description: "Disable D/K/R/E sampling in the ligand first shell", advanced: true}

  thermompnn:
    display_name: "ThermoMPNN-D"
    category: fitness
    summary: Stability change (ΔΔG) prediction for single and double mutants (ThermoMPNN-D).
    use_when: Use this to estimate stability changes for single mutations or nearby double mutations.
    input_summary: One PDB structure and the chain IDs to analyze.
    output_summary: Predicted ΔΔG tables for the selected single- or double-mutant mode.
    considerations:
      - Double-mutant results depend on the selected mode and Cα distance cutoff.
    runtime_family: "mpnn"
    input_extension: ".pdb"
    input_label: "PDB file"
    input_workspace: *structure_workspace
    stage_markers:
      thermompnn: "ThermoMPNN-D stability prediction"
    params:
      - name: "chains"
        type: "str"
        default: "A"
        description: "Chain IDs to analyze"
      - name: "mode"
        type: "str"
        default: "single"
        description: "single, additive, or epistatic"
        choices: ["single", "additive", "epistatic"]
      - {name: "batch_size", type: "int", default: 256, minimum: 1, description: "Prediction batch size"}
      - {name: "threshold", type: "float", default: -0.5, description: "Only save mutations below this ΔΔG threshold", unit: "kcal/mol", advanced: true}
      - {name: "distance", type: "float", default: 5.0, minimum: 0, description: "Pairwise Cα cutoff for double mutants", unit: "Å", advanced: true}
      - {name: "ss_penalty", type: "bool", default: false, description: "Apply an explicit disulfide breakage penalty", advanced: true}

  prime:
    display_name: "Pro-Prime"
    category: fitness
    summary: Optimal growth temperature (OGT) prediction from a protein sequence (Pro-Prime).
    use_when: Use this to estimate a protein sequence’s optimal growth temperature.
    input_summary: One protein sequence as FASTA.
    output_summary: A table containing the model-predicted optimal growth temperature.
    considerations:
      - The prediction is model-derived and should be interpreted within the model’s training domain.
    runtime_family: "prime"
    runner_args: ["ogt"]
    gpus: true
    input_extension: ".fasta"
    input_label: "FASTA file"
    input_workspace: *fasta_workspace
    stage_markers:
      prime: "Pro-Prime OGT prediction"
    params: []

  prime_dms:
    display_name: "PRIME DMS"
    category: fitness
    summary: Fitness prediction for mutations (Prime DMS).
    use_when: Use this for sequence-based mutation scoring, either exhaustive single substitutions or supplied variants.
    input_summary: FASTA input where the first record is the reference; additional equal-length records are variants.
    output_summary: A table of PRIME mutation scores for the generated or supplied variants.
    considerations:
      - Record order is meaningful, and supplied variants must match the reference length.
    runtime_family: "prime"
    runner_args: ["dms"]
    gpus: true
    input_extension: ".fasta"
    input_label: "Protein FASTA file"
    input_extensions: [".fasta", ".fa", ".faa"]
    primary_input_extensions: [".fasta", ".fa", ".faa"]
    allow_multiple_inputs: true
    max_input_files: 64
    input_workspace: *fasta_workspace
    stage_markers:
      prime_dms: "PRIME zero-shot mutation scoring"
    params: []

  rfdiffusion:
    display_name: "RFdiffusion"
    category: design
    summary: Protein backbone generation via RFdiffusion.
    use_when: Use this to generate new backbones, scaffold a motif, or design a binder around a target surface.
    input_summary: No file for unconditional generation, or a primary PDB for structure-guided modes; auxiliary files remain in the snapshot.
    output_summary: Generated backbone structures and optional diffusion trajectories.
    considerations:
      - Motif and binder modes require valid structure selections and a server-normalized design plan.
    runtime_family: "placer-rfdiffusion"
    runner_args: ["rfdiffusion"]
    gpus: true
    input_extension: ".pdb"
    input_label: "PDB file"
    input_extensions: [".pdb", ".cif", ".json"]
    primary_input_extensions: [".pdb"]
    allow_multiple_inputs: true
    max_input_files: 64
    min_input_files: 0
    input_workspace:
      steps:
      - id: material
        title: Provide the input
        description: Choose the scientific input for this experiment
        capabilities:
        - plugin: files
          id: source_files
          title: Input workspace
          description: Upload a primary PDB for structure-guided modes; unconditional generation needs no file.
          options:
            primary_required: false
        - plugin: structure
          id: structure_builder
          title: Structure
          description: Inspect chains and residues in the primary structure.
          options:
            source: source_files
            select_chains: true
            select_residues: true
      - id: intent
        title: Define the scientific intent
        description: Specify which molecular features the method should preserve, redesign, or analyze
        capabilities:
        - plugin: rfdiffusion-regions
          id: design_regions
          title: Design regions
          description: Build unconditional, motif-scaffolding, binder, or expert contigs.
          options:
            source: structure_builder
            fields:
            - design_mode
            - contig
            - hotspot_res
            syntax: rfdiffusion
            modes:
            - unconditional
            - motif_scaffolding
            - binder
            - expert
      - id: settings
        title: Set the experiment
        description: Adjust only the controls that matter for this run
        capabilities:
        - plugin: parameters
          id: task_parameters
          title: Diffusion settings
      - id: review
        title: Review and run
        description: Check the input and settings before creating the task snapshot
        capabilities:
        - plugin: review
          id: submission_review
          title: Review design
          options:
            show_paths: true
    stage_markers:
      rfdiffusion: "RFdiffusion backbone generation"
    params:
      - {name: "design_mode", type: "str", default: "unconditional", choices: ["unconditional", "motif_scaffolding", "binder", "expert"], description: "Server-normalized RFdiffusion workspace mode", advanced: true}
      - name: "contig"
        type: "str"
        default: "100-100"
        description: "Contig string (e.g. 100-100 for monomer, 5-15/A10-25 for motif)"
      - name: "num_designs"
        type: "int"
        default: 10
        description: "Number of designs to generate"
        minimum: 1
        maximum: 1000
        step: 1
      - {name: "design_startnum", type: "int", default: 0, minimum: 0, description: "Starting output design number", advanced: true}
      - {name: "symmetry", type: "str", default: "", description: "Optional symmetry, e.g. c3, d2, tetrahedral", advanced: true}
      - {name: "recenter", type: "bool", default: true, description: "Recenter coordinates before diffusion", advanced: true}
      - {name: "radius", type: "float", default: 10.0, minimum: 0, description: "Symmetry neighbor radius", unit: "Å", advanced: true}
      - {name: "model_only_neighbors", type: "bool", default: false, description: "Model only neighboring symmetric subunits", advanced: true}
      - {name: "write_trajectory", type: "bool", default: true, description: "Write diffusion trajectories", advanced: true}
      - {name: "empty_cache_per_design", type: "bool", default: false, description: "Clear CUDA cache between designs", advanced: true}
      - {name: "cautious", type: "bool", default: true, description: "Skip designs whose outputs already exist", advanced: true}
      - {name: "align_motif", type: "bool", default: true, description: "Align the motif during sampling", advanced: true}
      - {name: "symmetric_self_cond", type: "bool", default: true, description: "Use symmetric self-conditioning", advanced: true}
      - {name: "final_step", type: "int", default: 1, minimum: 1, description: "Final reverse-diffusion step", advanced: true}
      - {name: "deterministic", type: "bool", default: false, description: "Use deterministic sampling", advanced: true}
      - {name: "cyclic", type: "bool", default: false, description: "Enable cyclic peptide mode", advanced: true}
      - {name: "cyc_chains", type: "str", default: "a", description: "Chains treated as cyclic", advanced: true}
      - {name: "inpaint_seq", type: "str", default: "", description: "Hydra list of sequence positions to mask", advanced: true}
      - {name: "inpaint_str", type: "str", default: "", description: "Hydra list of structure positions to mask", advanced: true}
      - {name: "inpaint_str_helix", type: "str", default: "", description: "Hydra list of helix-masked positions", advanced: true}
      - {name: "inpaint_str_strand", type: "str", default: "", description: "Hydra list of strand-masked positions", advanced: true}
      - {name: "inpaint_str_loop", type: "str", default: "", description: "Hydra list of loop-masked positions", advanced: true}
      - {name: "provide_seq", type: "str", default: "", description: "Hydra list of sequence positions kept visible", advanced: true}
      - {name: "length", type: "str", default: "", description: "Optional contig length constraint", advanced: true}
      # These checkpoint-sensitive defaults mirror the pinned RFdiffusion
      # config/inference/base.yaml. The runner forwards them intentionally so
      # checkpoint training metadata does not silently replace inference defaults.
      - {name: "diffuser_T", type: "int", default: 50, minimum: 1, description: "Number of diffusion timesteps", advanced: true}
      - {name: "diffuser_b_0", type: "float", default: 0.01, minimum: 0, description: "Initial translation variance", advanced: true}
      - {name: "diffuser_b_T", type: "float", default: 0.07, minimum: 0, description: "Final translation variance", advanced: true}
      - {name: "diffuser_schedule_type", type: "str", default: "linear", choices: ["linear"], description: "Translation noise schedule", advanced: true}
      - {name: "partial_T", type: "int", default: null, minimum: 1, description: "Optional partial-diffusion timestep", advanced: true}
      - {name: "noise_scale_ca", type: "float", default: 1.0, minimum: 0, description: "Cα noise scale", advanced: true}
      - {name: "final_noise_scale_ca", type: "float", default: 1.0, minimum: 0, description: "Final Cα noise scale", advanced: true}
      - {name: "ca_noise_schedule_type", type: "str", default: "constant", choices: ["constant"], description: "Cα noise schedule", advanced: true}
      - {name: "noise_scale_frame", type: "float", default: 1.0, minimum: 0, description: "Frame noise scale", advanced: true}
      - {name: "final_noise_scale_frame", type: "float", default: 1.0, minimum: 0, description: "Final frame noise scale", advanced: true}
      - {name: "frame_noise_schedule_type", type: "str", default: "constant", choices: ["constant"], description: "Frame noise schedule", advanced: true}
      - {name: "hotspot_res", type: "str", default: "", description: "Hydra list of PPI hotspot residues", advanced: true}
      - {name: "guiding_potentials", type: "str", default: "", description: "Hydra list of guiding potential definitions", advanced: true}
      - {name: "guide_scale", type: "float", default: 10.0, minimum: 0, description: "Guiding potential scale", advanced: true}
      - {name: "guide_decay", type: "str", default: "constant", description: "Guiding potential decay schedule", advanced: true}
      - {name: "substrate", type: "str", default: "", description: "Substrate residue identifier for substrate-contact potentials", advanced: true}
      - {name: "sidechain_input", type: "bool", default: false, description: "Include side-chain input features", advanced: true}
      - {name: "motif_sidechain_input", type: "bool", default: true, description: "Include motif side-chain features", advanced: true}

  placer:
    display_name: "PLACER"
    category: structure
    summary: All-atom modeling of protein-ligand complexes from an input structure (PLACER).
    use_when: Use this to generate or refine all-atom protein–ligand complex models from supplied structures.
    input_summary: One or more PDB or mmCIF complexes, with one selected as the primary structure.
    output_summary: Sampled complex structures and PLACER scoring tables.
    considerations:
      - Ligand, residue, mutation, bond, and crop identifiers must follow the pinned PLACER syntax.
    runtime_family: "placer-rfdiffusion"
    runner_args: ["placer"]
    gpus: true
    input_extension: ".pdb"
    input_label: "PDB / mmCIF file"
    input_extensions: [".pdb", ".cif", ".mmcif"]
    primary_input_extensions: [".pdb", ".cif", ".mmcif"]
    allow_multiple_inputs: true
    max_input_files: 64
    input_workspace:
      steps:
      - id: material
        title: Provide the input
        description: Choose the scientific input for this experiment
        capabilities:
        - plugin: files
          id: source_files
          title: Structure workspace
          description: Upload all PDB/mmCIF inputs; nested paths remain intact.
          options:
            primary_required: true
        - plugin: structure
          id: structure_builder
          title: Structures and ligands
          description: Inspect the primary structure and its chains before sampling.
          options:
            source: source_files
            select_chains: true
            select_residues: true
      - id: intent
        title: Define the scientific intent
        description: Specify which molecular features the method should preserve, redesign, or analyze
        capabilities:
        - plugin: regions
          id: placement_regions
          title: Placement context
          description: Specify target residues, mutations, ligands, or crop centers when needed.
          options:
            source: structure_builder
            fields:
            - predict_ligand
            - fixed_ligand
            - target_res
            - mutate
            - crop_centers
            - corruption_centers
            syntax: placer
      - id: settings
        title: Set the experiment
        description: Adjust only the controls that matter for this run
        capabilities:
        - plugin: parameters
          id: task_parameters
          title: Sampling settings
      - id: review
        title: Review and run
        description: Check the input and settings before creating the task snapshot
        capabilities:
        - plugin: review
          id: submission_review
          title: Review placement
          options:
            show_paths: true
    stage_markers:
      placer: "PLACER structure generation"
    params:
      - name: "num_samples"
        type: "int"
        default: 50
        description: "Number of samples"
        minimum: 1
        maximum: 10000
        step: 1
      - name: "predict_ligand"
        type: "str"
        default: ""
        description: "Space-separated ligand identifiers to predict; blank uses PLACER defaults"
      - {name: "use_sm", type: "bool", default: true, description: "Use small-molecule context"}
      - {name: "fixed_ligand", type: "str", default: "", description: "Space-separated ligand identifiers to keep fixed", advanced: true}
      - {name: "target_res", type: "str", default: "", description: "Protein residue used as crop center when no ligand is present", advanced: true}
      - {name: "fixed_ligand_noise", type: "float", default: null, minimum: 0, unit: "Å", description: "Noise applied to fixed ligand coordinates", advanced: true}
      - {name: "rerank", type: "str", default: "", choices: ["", "prmsd", "plddt", "plddt_pde"], description: "Metric used to rerank output models", advanced: true}
      - {name: "cautious", type: "bool", default: false, description: "Skip an input when its output CSV already exists", advanced: true}
      - {name: "exclude_common_ligands", type: "bool", default: false, description: "Exclude common solvents and crystallographic additives", advanced: true}
      - {name: "predict_multi", type: "bool", default: false, description: "Predict and score all allowed ligands", advanced: true}
      - {name: "bonds", type: "str", default: "", description: "Space-separated custom bond specifications", advanced: true}
      - {name: "mutate", type: "str", default: "", description: "Space-separated residue mutations, e.g. 5A:TRP", advanced: true}
      - {name: "crop_centers", type: "str", default: "", description: "Space-separated atom crop centers", advanced: true}
      - {name: "corruption_centers", type: "str", default: "", description: "Space-separated atom corruption centers", advanced: true}
      - {name: "ignore_ligand_hydrogens", type: "bool", default: false, description: "Ignore ligand hydrogen mismatches", advanced: true}

  bioemu:
    display_name: "BioEmu"
    category: structure
    summary: Conformational ensemble sampling from sequence (BioEmu).
    use_when: Use this to sample a diverse conformational ensemble from one protein sequence.
    input_summary: One protein sequence as FASTA.
    output_summary: A filtered ensemble of sampled protein conformations and supporting artifacts.
    considerations:
      - A generated ensemble is a model sample and not a measured thermodynamic population.
    runtime_family: "bioemu"
    gpus: true
    input_extension: ".fasta"
    input_label: "FASTA file"
    input_workspace: *fasta_workspace
    stage_markers:
      bioemu: "BioEmu structure sampling"
    params:
      - name: "num_samples"
        type: "int"
        default: 10
        description: "Number of structure samples"
        minimum: 1
        maximum: 10000
      - {name: "batch_size_100", type: "int", default: 10, minimum: 1, description: "GPU batch size scaled to a 100-residue sequence", advanced: true}
      - {name: "denoiser_type", type: "str", default: "dpm", choices: ["dpm", "heun"], description: "Sampling denoiser", advanced: true}
      - {name: "filter_samples", type: "bool", default: true, description: "Filter structures with clashes or invalid bond lengths", advanced: true}
      - {name: "base_seed", type: "int", default: null, minimum: 0, description: "Optional deterministic base seed", advanced: true}

  easifa:
    display_name: "EasIFA2 Active Sites"
    category: function
    summary: Active-site annotation with optional reaction context (EasIFA).
    use_when: Use this to annotate likely enzyme active-site residues, optionally with reaction context.
    input_summary: One enzyme PDB structure and, optionally, a reaction SMILES string.
    output_summary: Residue-level active-site annotations linked to the submitted enzyme structure.
    considerations:
      - Blank reaction context selects the structure-only model; sequence length is bounded by the configured maximum.
    runtime_family: "easifa"
    gpus: true
    input_extension: ".pdb"
    input_label: "Enzyme structure (PDB)"
    input_workspace:
      steps:
      - id: material
        title: Provide the input
        description: Choose the scientific input for this experiment
        capabilities:
        - plugin: files
          id: source_files
          title: Enzyme structure
          options:
            primary_required: true
        - plugin: structure
          id: structure_builder
          title: Structure
          description: Inspect the uploaded enzyme and detected chains.
          options:
            source: source_files
            select_chains: false
            select_residues: false
      - id: settings
        title: Set the experiment
        description: Adjust only the controls that matter for this run
        capabilities:
        - plugin: parameters
          id: task_parameters
          title: Reaction context
      - id: review
        title: Review and run
        description: Check the input and settings before creating the task snapshot
        capabilities:
        - plugin: review
          id: submission_review
          title: Review annotation
          options:
            show_paths: true
    result_workspace:
      views:
        - plugin: entity-table
          id: active_sites
          role: primary
          title: Active-site mapping
          description: Predicted active-site residues in the submitted enzyme structure.
          sources:
            table:
              - {path: "active_sites.csv", required: true}
            structure:
              - {path: "enzyme_structure.pdb", required: true}
          mapping:
            entity: residue
            key_columns: [chain, residue_index]
            label_column: site_name
            chain_column: chain
            residue_column: residue_index
            numbering: label_seq_id
            evidence_columns: [site_class, probabilities]
    stage_markers:
      easifa: "EasIFA2 active-site annotation"
    params:
      - {name: "reaction_smiles", type: "str", default: "", description: "Optional reaction SMILES (reactants>>products); blank uses the structure-only model"}
      - {name: "max_length", type: "int", default: 1000, minimum: 1, description: "Maximum enzyme sequence length", advanced: true}
      - {name: "pretty", type: "bool", default: true, description: "Pretty-print the full JSON result", advanced: true}
      - {name: "verbose", type: "bool", default: false, description: "Include detailed upstream inference progress", advanced: true}

  freebindcraft:
    display_name: "FreeBindCraft"
    category: design
    summary: Protein binder design using OpenMM relax, FASPR, and sc-rs shape complementarity.
    use_when: Use this for an end-to-end binder-design campaign against a prepared target structure.
    input_summary: One target protein structure in PDB format, with target chains and optional hotspot residues.
    output_summary: Accepted binder structures and their design and ranking metrics.
    considerations:
      - The run may explore many trajectories before enough designs pass the selected filters.
    runtime_family: "freebindcraft"
    gpus: true
    input_extension: ".pdb"
    input_extensions: [".pdb"]
    primary_input_extensions: [".pdb"]
    allow_multiple_inputs: false
    max_input_files: 1
    input_label: "Protein structure"
    input_workspace: *structure_workspace
    result_workspace:
      views:
        - plugin: candidate-collection
          id: accepted_binders
          role: primary
          title: Accepted binder designs
          description: Binder structures that passed the selected campaign filters.
          sources:
            candidates:
              - {glob: "Accepted/*.pdb", required: true}
          mapping: {}
    stage_markers:
      parse: "Parse target settings"
      design: "Binder design loop"
    params:
      - name: binder_name
        type: str
        default: "binder"
        description: "Short name used for generated design files"
      - name: chains
        type: str
        default: "A"
        description: "Target chain IDs, comma- or space-separated"
      - name: target_hotspot_residues
        type: str
        default: ""
        description: "Target hotspot residue positions, comma- or space-separated"
      - name: length_min
        type: int
        default: 65
        minimum: 10
        maximum: 300
        description: "Minimum binder length"
      - name: length_max
        type: int
        default: 150
        minimum: 10
        maximum: 300
        description: "Maximum binder length"
      - name: number_of_final_designs
        type: int
        default: 1
        minimum: 1
        maximum: 100
        description: "Number of final designs to output"
      - name: filters_preset
        type: str
        default: "default_filters"
        choices: ["default_filters", "relaxed_filters", "no_filters"]
        description: "Filter preset for binder evaluation"
      - name: rank_by
        type: str
        default: "i_pTM"
        choices: ["i_pTM", "ipSAE"]
        description: "Ranking metric for designs"
      - name: max_trajectories
        type: int
        default: 20
        minimum: 1
        maximum: 1000
        description: "Safety cap on trajectory count"

  alphafold:
    display_name: "AlphaFold2"
    category: structure
    citation_dois:
      - {num: 1, doi: "10.1038/s41586-021-03819-2", title: "Highly accurate protein structure prediction with AlphaFold"}
      - {num: 2, doi: "10.1101/2021.10.04.463034", title: "Protein complex prediction with AlphaFold-Multimer"}
    citation_bibtex: |
      @article{Jumper_2021, title={Highly accurate protein structure prediction with AlphaFold}, volume={596}, ISSN={1476-4687}, url={http://dx.doi.org/10.1038/s41586-021-03819-2}, DOI={10.1038/s41586-021-03819-2}, number={7873}, journal={Nature}, publisher={Springer Science and Business Media LLC}, author={Jumper, John and Evans, Richard and Pritzel, Alexander and Green, Tim and Figurnov, Michael and Ronneberger, Olaf and Tunyasuvunakool, Kathryn and Bates, Russ and Žídek, Augustin and Potapenko, Anna and Bridgland, Alex and Meyer, Clemens and Kohl, Simon A. A. and Ballard, Andrew J. and Cowie, Andrew and Romera-Paredes, Bernardino and Nikolov, Stanislav and Jain, Rishub and Adler, Jonas and Back, Trevor and Petersen, Stig and Reiman, David and Clancy, Ellen and Zielinski, Michal and Steinegger, Martin and Pacholska, Michalina and Berghammer, Tamas and Bodenstein, Sebastian and Silver, David and Vinyals, Oriol and Senior, Andrew W. and Kavukcuoglu, Koray and Kohli, Pushmeet and Hassabis, Demis}, year={2021}, month=July, pages={583–589} }

      @article{Evans_2021, title={Protein complex prediction with AlphaFold-Multimer}, url={http://dx.doi.org/10.1101/2021.10.04.463034}, DOI={10.1101/2021.10.04.463034}, publisher={openRxiv}, author={Evans, Richard and O’Neill, Michael and Pritzel, Alexander and Antropova, Natasha and Senior, Andrew and Green, Tim and Žídek, Augustin and Bates, Russ and Blackwell, Sam and Yim, Jason and Ronneberger, Olaf and Bodenstein, Sebastian and Zielinski, Michal and Bridgland, Alex and Potapenko, Anna and Cowie, Andrew and Tunyasuvunakool, Kathryn and Jain, Rishub and Clancy, Ellen and Kohli, Pushmeet and Jumper, John and Hassabis, Demis}, year={2021}, month=Oct }
    summary: DeepMind AlphaFold2 structure prediction (JAX, multimer-capable).
    use_when: Use this for local-database AlphaFold2 monomer or multimer prediction.
    input_summary: One FASTA file; use multiple records for a multimer together with the multimer preset.
    output_summary: Ranked predicted structures, confidence data, features, and optional relaxed models.
    considerations:
      - MSA and template searches use the server’s installed databases and can dominate runtime.
    runtime_family: "alphafold"
    gpus: true
    input_extension: ".fasta"
    input_extensions: [".fasta", ".fa", ".faa"]
    primary_input_extensions: [".fasta", ".fa", ".faa"]
    input_label: "Protein sequence (FASTA)"
    input_workspace: *fasta_workspace
    result_workspace:
      views:
        - plugin: candidate-collection
          id: ranked_models
          role: primary
          title: Ranked structure models
          description: Predicted structures in the ranking order published by AlphaFold.
          sources:
            candidates:
              - {glob: "*/ranked_*.pdb", required: true}
          mapping:
            confidence_encoding: plddt_bfactor
    stage_markers:
      msa_searching: "MSA searching"
      featuring: "Building features"
      modeling: "Folding models"
      relaxing: "Amber relaxation"
    workflow:
      - name: features
        display_name: "MSA and features"
        requires_gpu: false
        runner_args: ["-s", "features"]
        stage_markers: ["msa_searching", "featuring"]
      - name: model
        display_name: "Model and relax"
        requires_gpu: true
        runner_args: ["-s", "model"]
        stage_markers: ["modeling", "relaxing"]
    params:
      - name: "model_preset"
        type: "str"
        default: "monomer"
        choices: ["monomer", "monomer_casp14", "monomer_ptm", "multimer"]
        description: "Monomer, monomer with pTM head, extra-ensembling monomer, or multimer"
      - name: "max_template_date"
        type: "str"
        default: "2021-11-01"
        description: "Maximum template release date (YYYY-MM-DD)"
      - {name: "num_multimer_predictions_per_model", type: "int", default: 1, minimum: 1, maximum: 20, description: "Multimer predictions per model (different seeds)", advanced: true}
      - {name: "db_preset", type: "str", default: "full_dbs", choices: ["full_dbs"], description: "Sequence database preset (full_dbs)", advanced: true}
      - {name: "models_to_relax", type: "str", default: "best", choices: ["none", "best", "all"], description: "Amber relaxation of the final models", advanced: true}
      - {name: "benchmark", type: "bool", default: false, description: "Time the JAX model evaluations", advanced: true}

  colabfold_af2:
    display_name: "ColabFold (AlphaFold2)"
    category: structure
    citation_dois:
      - {num: 1, doi: "10.1038/s41586-021-03819-2", title: "Highly accurate protein structure prediction with AlphaFold"}
      - {num: 2, doi: "10.1101/2021.10.04.463034", title: "Protein complex prediction with AlphaFold-Multimer"}
      - {num: 3, doi: "10.1038/s41592-022-01488-1", title: "ColabFold: making protein folding accessible to all"}
    citation_bibtex: |
      @article{Jumper_2021, title={Highly accurate protein structure prediction with AlphaFold}, volume={596}, ISSN={1476-4687}, url={http://dx.doi.org/10.1038/s41586-021-03819-2}, DOI={10.1038/s41586-021-03819-2}, number={7873}, journal={Nature}, publisher={Springer Science and Business Media LLC}, author={Jumper, John and Evans, Richard and Pritzel, Alexander and Green, Tim and Figurnov, Michael and Ronneberger, Olaf and Tunyasuvunakool, Kathryn and Bates, Russ and Žídek, Augustin and Potapenko, Anna and Bridgland, Alex and Meyer, Clemens and Kohl, Simon A. A. and Ballard, Andrew J. and Cowie, Andrew and Romera-Paredes, Bernardino and Nikolov, Stanislav and Jain, Rishub and Adler, Jonas and Back, Trevor and Petersen, Stig and Reiman, David and Clancy, Ellen and Zielinski, Michal and Steinegger, Martin and Pacholska, Michalina and Berghammer, Tamas and Bodenstein, Sebastian and Silver, David and Vinyals, Oriol and Senior, Andrew W. and Kavukcuoglu, Koray and Kohli, Pushmeet and Hassabis, Demis}, year={2021}, month=July, pages={583–589} }
      
      @article{Evans_2021, title={Protein complex prediction with AlphaFold-Multimer}, url={http://dx.doi.org/10.1101/2021.10.04.463034}, DOI={10.1101/2021.10.04.463034}, publisher={openRxiv}, author={Evans, Richard and O’Neill, Michael and Pritzel, Alexander and Antropova, Natasha and Senior, Andrew and Green, Tim and Žídek, Augustin and Bates, Russ and Blackwell, Sam and Yim, Jason and Ronneberger, Olaf and Bodenstein, Sebastian and Zielinski, Michal and Bridgland, Alex and Potapenko, Anna and Cowie, Andrew and Tunyasuvunakool, Kathryn and Jain, Rishub and Clancy, Ellen and Kohli, Pushmeet and Jumper, John and Hassabis, Demis}, year={2021}, month=Oct }

      @article{Mirdita_2022, title={ColabFold: making protein folding accessible to all}, volume={19}, ISSN={1548-7105}, url={http://dx.doi.org/10.1038/s41592-022-01488-1}, DOI={10.1038/s41592-022-01488-1}, number={6}, journal={Nature Methods}, publisher={Springer Science and Business Media LLC}, author={Mirdita, Milot and Schütze, Konstantin and Moriwaki, Yoshitaka and Heo, Lim and Ovchinnikov, Sergey and Steinegger, Martin}, year={2022}, month=May, pages={679–682} }
    summary: ColabFold AlphaFold2 prediction with online MMseqs2 MSA search and local GPU inference.
    use_when: Use this for AlphaFold2 prediction with public MMseqs2 MSA search and local model inference.
    input_summary: One FASTA file; multiple records represent a complex.
    output_summary: The searched alignment, ranked predicted structures, scores, and optional relaxed models.
    considerations:
      - MSA generation depends on the external ColabFold service unless single-sequence mode is selected.
    runtime_family: "colabfold_af2"
    gpus: true
    input_extension: ".fasta"
    input_extensions: [".fasta", ".fa", ".faa"]
    primary_input_extensions: [".fasta", ".fa", ".faa"]
    input_label: "Protein sequence (FASTA)"
    input_workspace: *fasta_workspace
    stage_markers:
      msa_searching: "MSA searching"
      modeling: "Folding models"
    workflow:
      - name: features
        display_name: "MSA and features"
        requires_gpu: false
        requires_network: true
        runner_args: ["-s", "features"]
        stage_markers: ["msa_searching"]
      - name: model
        display_name: "Model and optional relax"
        requires_gpu: true
        runner_args: ["-s", "model"]
        stage_markers: ["modeling"]
    params:
      - name: "model_type"
        type: "str"
        default: "auto"
        choices: ["auto", "alphafold2", "alphafold2_ptm", "alphafold2_multimer_v3"]
        description: "Auto-select pTM for monomers and multimer-v3 for complexes"
      - {name: "msa_mode", type: "str", default: "mmseqs2_uniref_env", choices: ["mmseqs2_uniref_env", "mmseqs2_uniref", "single_sequence"], description: "Online MMseqs2 search database"}
      - {name: "num_recycle", type: "int", default: 3, minimum: 0, maximum: 20, description: "Prediction recycles"}
      - {name: "num_models", type: "int", default: 5, minimum: 1, maximum: 5, description: "AlphaFold models to run", advanced: true}
      - {name: "num_seeds", type: "int", default: 1, minimum: 1, maximum: 20, description: "Random seeds per model", advanced: true}
      - {name: "random_seed", type: "int", default: 0, minimum: 0, description: "Initial random seed", advanced: true}
      - {name: "num_relax", type: "int", default: 1, minimum: 0, maximum: 5, description: "Top-ranked models to relax with Amber (0 disables relaxation)", advanced: true}
