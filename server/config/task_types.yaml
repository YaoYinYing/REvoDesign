# REvoDesign task type registry — portable definitions (checked into git).
#
# Runtime families own images and entrypoints. Task types own the user-facing
# I/O and parameter contract. Machine-specific paths and resource limits live
# in config/runners/<runtime-family>.yaml.
#
# Adding a task to an existing family only requires a task_types entry. Adding
# a runtime family also requires one runner YAML, Dockerfile, and .def file.

# Global execution backend. Production SLURM deployments set these to
# "slurm" and "apptainer" in their deployed CONFIG_DIR copy. Every family
# declares a SIF destination, but Docker execution does not read or validate
# the file at that path.
job_executor: "docker"
container_runtime: "docker"

runtime_families:
  gremlin:
    docker_image: "revodesign-revocompute-runner"
    entrypoint: ["bash", "/app/revocompute/run.sh"]
    dockerfile: "docker/runners/pssm_gremlin/Dockerfile"
    definition: "docker/runners/pssm_gremlin/gremlin.def"
    slurm_image: "/mnt/data/srv/revodesign/server-slurm/images/gremlin_v1.sif"
