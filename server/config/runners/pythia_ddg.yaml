# Pythia-ddG runner — local development settings.
#
# Pythia-ddG doesn't need external databases or model mounts — the model
# checkpoints (pythia-c.pt, pythia-p.pt) are baked into the Docker image.
# Edit this file when deploying to a new node.

mounts: []

env: {}

nproc: 4
max_runtime_seconds: 3600

defaults: {}

# -- SLURM + Apptainer (set in deployed config, not here) --
# runner: slurm
# container_runtime: apptainer
# slurm_image: /mnt/data/srv/revodesign/server-slurm/images/pythia_ddg_v1.sif
