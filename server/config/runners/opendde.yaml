# OpenDDE runner — local development settings.
#
# OpenDDE_ROOT_DIR is /mnt/db/opendde (set in Dockerfile ENV).  Mount the
# host directory there so the checkpoint and search databases are available.
# Edit this file when deploying to a new node.

mounts:
  - host_path: "/mnt/db/opendde"
    container_path: "/mnt/db/opendde"
    mode: "ro"

env: {}

gpus: true

nproc: 1
max_runtime_seconds: 86400

defaults: {}
