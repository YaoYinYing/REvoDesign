# GREMLIN runner — local development settings.
#
# Edit this file when deploying to a new node.  Host paths, resource limits,
# and default parameter values live here — never in .env.

mounts:
  - host_path: "/Users/yyy/Documents/protein_design/REvoDesign/playground/miniuc/uc30"
    container_path: "/opt/db/uniref30"
    mode: "ro"
  - host_path: "/Users/yyy/Documents/protein_design/REvoDesign/playground/miniuc/uc90"
    container_path: "/opt/db/uniref90"
    mode: "ro"

env:
  GREMLIN_CALC_CPU_NUM: "4"
  OMP_NUM_THREADS: "4"
  OPENBLAS_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  VECLIB_MAXIMUM_THREADS: "4"
  NUMEXPR_NUM_THREADS: "4"
  TF_NUM_INTRAOP_THREADS: "4"
  TF_NUM_INTEROP_THREADS: "4"
  OMP_DYNAMIC: "FALSE"
  MKL_DYNAMIC: "FALSE"
  # DB prefixes inside the container — run.sh picks these up from env.
  uniref30_db: "/opt/db/uniref30/miniuc30"
  uniref90_db: "/opt/db/uniref90/uniref90"

max_runtime_seconds: 7200

defaults:
  iter: 100
