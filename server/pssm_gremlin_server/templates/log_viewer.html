<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REvoDesign | Server Logs</title>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="icon" type="image/svg+xml" href="/PSSM_GREMLIN/logo.svg"/>
<link rel="mask-icon" href="/PSSM_GREMLIN/logo.svg" color="#000000"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/log-viewer.css">
<script src="/static/js/theme.js"></script>
</head>
<body>
<main class="page">
  <section class="panel hero">
    <div class="hero-top">
      <div>
        <h1 class="headline">Server Logs</h1>
        <p class="subline">Read the four active, unrotated service logs.</p>
      </div>
      <div class="hero-actions">
        <button class="btn btn-soft theme-toggle mode-auto" type="button" id="themeToggle" aria-pressed="mixed" title="Cycle theme"><span class="theme-icon" aria-hidden="true">&#9680;</span></button>
        <a class="btn btn-soft" href="/PSSM_GREMLIN/dashboard">&larr;&nbsp;Dashboard</a>
        <button class="btn btn-logout" type="button" id="logoutBtn">Log out</button>
      </div>
    </div>
  </section>

  <section class="panel log-panel">
    <div class="log-toolbar" role="tablist" aria-label="Server log files">
      <button class="log-select active" type="button" data-log="gunicorn-access">Gunicorn access</button>
      <button class="log-select" type="button" data-log="gunicorn-error">Gunicorn error</button>
      <button class="log-select" type="button" data-log="celery-worker">Celery worker</button>
      <button class="log-select" type="button" data-log="maintenance">Maintenance</button>
      <button class="btn btn-soft" type="button" id="refreshLog">Refresh</button>
    </div>
    <p class="log-status muted" id="logStatus" role="status">Loading Gunicorn access…</p>
    <pre class="log-output" id="logOutput" tabindex="0" aria-live="polite"></pre>
  </section>
</main>

<script src="/static/js/auth-api.js"></script>
<script src="/static/js/log-viewer.js"></script>
</body>
</html>
