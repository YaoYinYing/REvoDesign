[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "revocompute"
version = "0.1.0"
description = "REvoDesign GREMLIN PSSM web server — Flask + Celery + Docker runner"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"
dependencies = [
    "APScheduler>=3.11,<4",
    "celery[redis]>=5.3",
    "docker>=7.1",
    "Flask>=3.1",
    "gunicorn>=25.1",
    "pydantic>=2.0",
    "SQLAlchemy>=2.0",
    "werkzeug",
    "itsdangerous",
]

[project.optional-dependencies]
resend = [
    "resend>=2.0",
]
test = [
    "pytest>=8",
    "pytest-mock>=3.14",
    "pytest-cov>=6",
    "requests>=2.33",
]

[tool.setuptools.packages.find]
include = ["revocompute*"]

[tool.setuptools.package-data]
revocompute = [
    "templates/**",
    "templates/images/*",
    "static/css/*",
    "static/js/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
