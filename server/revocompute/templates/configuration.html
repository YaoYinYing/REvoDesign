<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REvoDesign | Configuration</title>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="icon" type="image/svg+xml" href="/compute/logo.svg"/>
<link rel="mask-icon" href="/compute/logo.svg" color="#000000"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/configuration.css">
<script src="/static/js/theme.js"></script>
</head>
<body>
<main class="page">
  <section class="panel hero">
    <div class="hero-top">
      <div>
        <h1 class="headline">Configuration</h1>
        <p class="subline">Runtime admin settings — task type toggles, resource limits, and server parameters.</p>
      </div>
      <div class="hero-actions">
        <button class="btn btn-soft theme-toggle mode-auto" type="button" id="themeToggle" aria-pressed="mixed" title="Cycle theme"><span class="theme-icon" aria-hidden="true">&#9680;</span></button>
        <a class="btn btn-soft" href="/compute/dashboard">&larr;&nbsp;Dashboard</a>
        <button class="btn btn-logout" type="button" id="logoutBtn">Log out</button>
      </div>
    </div>
  </section>

  <section class="panel config-panel">
    <div class="config-toolbar">
      <button class="btn btn-primary" id="addRowBtn">Add Row</button>
      <button class="btn btn-primary" id="saveBtn">Save Changes</button>
      <span class="muted" id="saveStatus"></span>
    </div>
    <div class="config-table-wrap">
      <table class="config-table">
        <thead>
          <tr><th>Key</th><th>Value</th><th></th></tr>
        </thead>
        <tbody id="configBody"></tbody>
      </table>
    </div>
    <p class="muted" style="margin-top:1rem;">
      Task-type toggles use keys like <code>task_type.pythia_ddg.enabled</code> → <code>true</code> / <code>false</code>.
      Changes take effect immediately for new submissions.
    </p>
  </section>
</main>

<script src="/static/js/auth-api.js"></script>
<script src="/static/js/configuration.js"></script>
</body>
</html>
